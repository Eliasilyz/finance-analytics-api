name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && echo "Run 'go fmt ./...'" && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Docker build
        run: docker build -t finance-analytics-api:ci .

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      # GitHub-hosted runners ship a Docker daemon, so testcontainers-go
      # works out of the box (no DinD setup needed). Verified here.
      - name: Verify Docker availability
        run: docker version

      - name: Run integration tests
        run: go test -tags integration -v ./test/integration/...